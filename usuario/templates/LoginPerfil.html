{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <title>StudyPlan - Login</title>

    <link rel="stylesheet" href="{% static 'LoginPerfil/LoginPerfil.css' %}">

    <script src="https://unpkg.com/lucide@latest"></script>
</head>


<body>

    <div class="card-container">

        <div class="logo-icon">
            <i data-lucide="book-open"></i>
        </div>

        <h1 class="title">
            Faça seu login
        </h1>

        <p class="subtitle">
            Entre com sua conta para continuar
        </p>


        <form id="login-form" method="POST">

            {% csrf_token %}


            <div class="input-area">

                <p class="subtitle">
                    Digite seu email
                </p>


                <label class="course-balloon input-balloon">

                    <div class="balloon-content">

                        <i data-lucide="mail"></i>

                        <input 
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Digite seu email..."
                            required
                        >

                    </div>

                </label>

            </div>



            <div class="input-area">

                <p class="subtitle">
                    Digite sua senha
                </p>


                <label class="course-balloon input-balloon">

                    <div class="balloon-content">

                        <i data-lucide="lock"></i>

                        <input 
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha..."
                            required
                        >

                    </div>

                </label>

            </div>



            <button type="submit" class="btn-primary">
                Entrar
            </button>


        </form>


        {% if erro %}
            <p class="subtitle" style="color: #dc2626; margin-top: 15px;">
                {{ erro }}
            </p>
        {% endif %}



        <div class="footer-link">

            <a href="{% url 'cadastro' %}">
                Não possui conta? Cadastre-se
            </a>

        </div>


    </div>



<script src="{% static 'LoginPerfil/script.js' %}"></script>

<script>
    lucide.createIcons();
</script>


</body>

</html>
