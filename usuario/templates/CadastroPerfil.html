{% load static %}

<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="{% static 'CadastroPerfil/CadastroPerfil.css' %}">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <div class="card-container">

        <div class="logo-icon">
            <i data-lucide="book-open"></i>
        </div>

        <h1 class="title">Faça seu cadastro</h1>


        <!-- ETAPA 1 -->

        <form id="form-step-1" class="form-step active" onsubmit="event.preventDefault(); goToStep2();">

            <p class="subtitle">Como podemos te chamar?</p>

            <div class="course-options">

                <label class="course-balloon input-balloon" style="cursor: default;">

                    <div class="balloon-content" style="width: 100%;">

                        <i data-lucide="user"></i>

                        <input
                            type="text"
                            id="nome-usuario"
                            name="nome"
                            placeholder="Digite seu nome..."
                            required
                            style="border: none; outline: none; background: transparent; width: 100%; font-size: inherit; font-family: inherit;"
                        >

                    </div>

                </label>

            </div>


            <p class="subtitle" style="margin-top: 15px;">
                Digite seu email
            </p>

            <div class="course-options">

                <label class="course-balloon input-balloon" style="cursor: default;">

                    <div class="balloon-content" style="width: 100%;">

                        <i data-lucide="mail"></i>

                        <input
                            type="email"
                            id="email-usuario"
                            name="email"
                            placeholder="Digite seu email..."
                            required
                            style="border: none; outline: none; background: transparent; width: 100%; font-size: inherit; font-family: inherit;"
                        >

                    </div>

                </label>

            </div>


            <p class="subtitle" style="margin-top: 15px;">
                Defina uma senha
            </p>

            <div class="course-options">

                <label class="course-balloon input-balloon" style="cursor: default;">

                    <div class="balloon-content" style="width: 100%;">

                        <i data-lucide="lock"></i>

                        <input
                            type="password"
                            id="senha-usuario"
                            name="senha"
                            placeholder="Digite sua senha..."
                            required
                            style="border: none; outline: none; background: transparent; width: 100%; font-size: inherit; font-family: inherit;"
                        >

                    </div>

                </label>

            </div>


            <!-- CURSOS -->

            <p class="subtitle" style="margin-top: 20px;">
                Selecione o seu curso
            </p>

            <div class="course-options">

                {% for curso in cursos %}

                <label class="course-balloon">

                    <input
                        type="radio"
                        name="curso"
                        value="{{ curso.id }}"
                        required
                    >

                    <div class="balloon-content">

                        {% if 'Mecatrônica' in curso.nome %}

                        <i data-lucide="bot"></i>

                        {% elif 'Informática' in curso.nome %}

                        <i data-lucide="monitor"></i>

                        {% elif 'Edificações' in curso.nome %}

                        <i data-lucide="building-2"></i>

                        {% else %}

                        <i data-lucide="book-open"></i>

                        {% endif %}

                        <span>{{ curso.nome }}</span>

                    </div>

                </label>

                {% endfor %}

            </div>


            <!-- BOTÕES -->

            <div class="button-group">

                <a href="{% url 'login' %}" class="btn-secondary">
                    Voltar para o login
                </a>

                <button
                    type="button"
                    class="btn-primary"
                    onclick="goToStep2()"
                >
                    Próximo Passo
                </button>

            </div>

        </form>



        <!-- ETAPA 2 -->

        <form
            id="form-step-2"
            class="form-step"
            onsubmit="event.preventDefault(); goToStep3();"
        >

            <p class="subtitle">
                Selecione a sua série
            </p>

            <div class="course-options">

                <!-- 1º ANO -->

                <label class="course-balloon">

                    <input
                        type="radio"
                        name="serie"
                        value="1"
                        required
                        onchange="carregarDisciplinas()"
                    >

                    <div class="balloon-content">
                        <span>1º Ano</span>
                    </div>

                </label>


                <!-- 2º ANO -->

                <label class="course-balloon">

                    <input
                        type="radio"
                        name="serie"
                        value="2"
                        onchange="carregarDisciplinas()"
                    >

                    <div class="balloon-content">
                        <span>2º Ano</span>
                    </div>

                </label>


                <!-- 3º ANO -->

                <label class="course-balloon">

                    <input
                        type="radio"
                        name="serie"
                        value="3"
                        onchange="carregarDisciplinas()"
                    >

                    <div class="balloon-content">
                        <span>3º Ano</span>
                    </div>

                </label>

            </div>


            <p class="subtitle" style="margin-top: 20px;">
                Escolha as disciplinas do seu curso
            </p>


            <div
                class="disciplinas-blank-balloon"
                id="lista-disciplinas"
            >
            </div>


            <div class="button-group">

                <button
                    type="button"
                    class="btn-secondary"
                    onclick="goToStep1()"
                >
                    Voltar
                </button>

                <button
                    type="submit"
                    class="btn-primary"
                >
                    Próximo
                </button>

            </div>

        </form>



        <!-- ETAPA 3 -->

        <form
            id="form-step-3"
            class="form-step"
            onsubmit="event.preventDefault(); finalizarCadastro();"
        >

            <p class="subtitle">
                Formação Geral
            </p>


            <div
                class="disciplinas-blank-balloon"
                id="lista-formacao-geral"
            >
            </div>


            <div
                class="button-group"
                style="margin-top: 20px;"
            >

                <button
                    type="button"
                    class="btn-secondary"
                    onclick="goToStep2From3()"
                >
                    Voltar
                </button>

                <button
                    type="submit"
                    class="btn-primary"
                >
                    Concluir Cadastro
                </button>

            </div>

        </form>

    </div>


    <script src="{% static 'CadastroPerfil/script.js' %}"></script>

    <script>
        lucide.createIcons();
    </script>

</body>

</html>
